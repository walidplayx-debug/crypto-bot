name: signals

on:
  schedule:
    - cron: "7 * * * *"        # backup: every hour (GitHub often delays these)
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write
  actions: write               # lets a finished run start the next one

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Download / update candles
        run: python -m bot.fetch
      - name: Compute the signal
        run: python -m bot.signals
      - name: Write run summary
        run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add docs RESULTS.md
          git diff --cached --quiet && exit 0
          git commit -m "signal: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

  # Wait until 7 minutes past the next hour, then start the next run.
  # This keeps the signal fresh every hour even when GitHub's schedule is late.
  next:
    needs: [update]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the next hour
        run: |
          now=$(date +%s)
          wait=$(( (3600 - now % 3600 + 420) % 3600 ))
          [ "$wait" -lt 300 ] && wait=$(( wait + 3600 ))
          echo "sleeping $wait s"; sleep "$wait"
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run evolve.yml --ref main --repo "${{ github.repository }}"
