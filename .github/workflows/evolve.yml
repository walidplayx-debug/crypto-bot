name: signals

on:
  schedule:                    # once a day after the daily close (00:00 UTC),
    - cron: "7 0 * * *"        # with backup times because GitHub is often late
    - cron: "37 1 * * *"
    - cron: "7 4 * * *"
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Already done today?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          y = (datetime.datetime.now(datetime.timezone.utc).date() - datetime.timedelta(days=1)).isoformat()
          try:
              done = json.load(open("docs/data.json"))["rotation"]["live"]["as_of"] == y
          except Exception:
              done = False
          manual = "${{ github.event_name }}" == "workflow_dispatch"
          print("skip=" + ("true" if done and not manual else "false"))
          PY
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with: { python-version: "3.12", cache: pip }
      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.check.outputs.skip != 'true'
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Download / update daily candles
        if: steps.check.outputs.skip != 'true'
        run: python -m bot.fetch
      - name: Compute the signal
        if: steps.check.outputs.skip != 'true'
        run: python -m bot.signals
      - name: Write run summary
        if: steps.check.outputs.skip != 'true'
        run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add docs RESULTS.md
          git diff --cached --quiet && exit 0
          git commit -m "signal: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
