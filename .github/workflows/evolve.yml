name: evolve

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:            # "Run workflow" button

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # always the newest state, even if this run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Download / update candles
        run: python -m bot.fetch
      - uses: actions/upload-artifact@v4
        with: { name: data, path: data, retention-days: 2 }

  evolve:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ["1h", "4h", "1h+4h"]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # always the newest state, even if this run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: data, path: data }
      - name: Evolve strategies
        run: python -m bot.evolve --variant "${{ matrix.variant }}" --minutes 40
      - uses: actions/upload-artifact@v4
        with: { name: "state-${{ matrix.variant }}", path: "state/${{ matrix.variant }}", retention-days: 2 }

  report:
    needs: [data, evolve]
    if: always() && needs.data.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # always the newest state, even if this run waited in the queue
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: data, path: data }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "state-1h", path: "state/1h" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "state-4h", path: "state/4h" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "state-1h+4h", path: "state/1h+4h" }
      - name: Build report
        run: python -m bot.report
      - name: Write run summary
        run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add state docs RESULTS.md
          git diff --cached --quiet && exit 0
          git commit -m "results: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
