<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📡 إشارات التناوب</title>
<style>
  :root{--page:#0b0b0b;--surf:#191919;--line:#303030;--ink:#efefef;--ink2:#9c9c9c;--blue:#338ced;
        --good:#53c556;--bad:#eb6263}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  main{max-width:720px;margin:auto;padding:18px 12px 40px}
  h1{margin:0 0 2px;font-size:22px}
  h2{margin:0 0 6px;font-size:17px}
  .muted{color:var(--ink2);font-size:13px}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .hero{border-color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--ink2);font-weight:500;font-size:13px}
  .scroll{overflow-x:auto}
  .num{direction:ltr;unicode-bidi:embed}
  .big{font-size:26px;font-weight:700}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:140px;background:#111;border:1px solid var(--line);border-radius:12px;padding:10px}
  ul{margin:6px 0;padding-inline-start:20px} li{margin:3px 0}
  img{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
  .note{background:#1f1a0d;border:1px solid #4a3a10;border-radius:12px;padding:10px 12px;font-size:13px;color:#e9d39a}
</style>
</head>
<body>
<main>
  <h1>📡 إشارات التناوب</h1>
  <div class="muted" id="meta">جاري التحميل…</div>
  <div id="app"></div>
  <div class="note">إشارات تجريبية لاختبار حي على الورق. الأرقام التاريخية مش ضمان للمستقبل، وما في شي هون نصيحة مالية.</div>
</main>
<script>
const pct = x => (x>=0?"+":"") + (x*100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const coin = s => s.replace("USDT","");
const side = x => x.side==="long" ? "🟢 شراء" : "🔴 بيع";

function render(d){
  const R = d.rotation, L = R.live, b = R.best, p = L.perf;
  const pos = L.positions.length
    ? L.positions.map(x=>`<tr><td>${side(x)}</td><td><b>${coin(x.symbol)}</b></td><td class="num">${Math.round(x.weight*100)}%</td><td class="num">${x.price}</td></tr>`).join("")
    : `<tr><td colspan="4">💤 كاش، ما في صفقات مفتوحة</td></tr>`;
  const log = L.log.map(e=>`<tr><td class="num">${e.date}</td><td>${e.positions.length ? e.positions.map(x=>`${x.side==="long"?"🟢":"🔴"} ${coin(x.symbol)}`).join(" · ") : "💤 كاش"}</td></tr>`).join("");
  const row = (n,m) => `<tr><td>${n}</td><td class="num ${m.total>=0?"good":"bad"}">${pct(m.total)}</td><td class="num">${(m.max_dd*100).toFixed(0)}%</td>
      <td class="num">${m.trades ?? "—"}</td><td class="num">${m.win_rate===undefined?"—":Math.round(m.win_rate*100)}</td><td class="num">${pct(m.bench)}</td></tr>`;
  document.getElementById("app").innerHTML = `
  <div class="card hero">
    <h2>الإشارة الحالية</h2>
    <div class="muted">محسوبة على إغلاق ${L.as_of} (UTC)</div>
    <div class="scroll"><table><tr><th></th><th>العملة</th><th>الحجم</th><th>السعر وقت الإشارة</th></tr>${pos}</table></div>
    <div class="row">
      <div class="stat"><div class="muted">المراجعة الجاية</div><div class="big num">${L.next_signal}</div><div class="muted">بعد 00:00 UTC</div></div>
      <div class="stat"><div class="muted">🧪 الاختبار الحي من ${L.start}</div>
        <div class="big num ${p.total>=0?"good":"bad"}">${p.days ? pct(p.total) : "—"}</div>
        <div class="muted">${p.days ? `${p.days} يوم · أقصى تراجع ${(p.max_dd*100).toFixed(0)}%` : "أول نتيجة بعد يومين"}</div></div>
    </div>
    <div class="muted" style="margin-top:8px">بدون رافعة · بدون وقف خسارة · الخروج بيصير لما يتغيّر الترتيب بالمراجعة</div>
  </div>

  <div class="card">
    <h2>📜 سجل الإشارات</h2>
    <div class="scroll"><table><tr><th>التاريخ</th><th>المراكز</th></tr>${log || `<tr><td colspan="2">لسا ما في إشارات</td></tr>`}</table></div>
  </div>

  <div class="card">
    <h2>⚙️ كيف بتشتغل</h2>
    <ul>${L.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <div class="muted">الفكرة: العملة اللي عم تطلع بتكمّل طلوع فترة، واللي عم تنزل بتكمّل نزول (الزخم).</div>
  </div>

  <div class="card">
    <h2>📊 الباكتست</h2>
    <div class="scroll"><table><tr><th></th><th>الربح</th><th>أقصى تراجع</th><th>صفقات</th><th>رابحة من 100</th><th>اشترِ واحتفظ</th></tr>
      ${row("تدريب", b.train)}${row("تحقق", b.valid)}${row("مخفي", b.test)}</table></div>
    <div class="muted">تدريب حتى ${d.split.train_end} · تحقق حتى ${d.split.valid_end} · المخفي بعدها، والبوت ما شافه وقت اختيار الإعدادات</div>
    <img src="${d.chart}?v=${encodeURIComponent(d.updated)}" alt="منحنى رأس المال">
  </div>`;
}

fetch("data.json?" + Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("meta").textContent = `آخر تحديث: ${d.updated}`;
  render(d);
  setTimeout(()=>location.reload(), 10*60*1000);
}).catch(()=>{ document.getElementById("meta").textContent = "لسا ما في بيانات، أول تحديث شغّال…"; });
</script>
</body>
</html>
